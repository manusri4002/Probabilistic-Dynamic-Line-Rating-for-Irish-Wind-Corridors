[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irish-dlr-engine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "lightgbm", "requests"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["dlr"]

[tool.pytest.ini_options]
testpaths = ["test"]